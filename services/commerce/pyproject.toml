[project]
name = "commerce"
version = "0.1.0"
description = "Commerce API: auth, catalog, cart, orders, search, outbox"
requires-python = ">=3.12"
dependencies = [
    "ai-commerce-telemetry",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    # 2.0.x: the OTel SQLAlchemy instrumentation supports < 2.1.
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator>=2.2",
    "argon2-cffi==25.1.0",
    "opensearch-py==3.2.0",
    "pinecone==10.0.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-urllib3==0.66b0",
]

[project.scripts]
commerce-seed = "commerce.seed.run:main"
commerce-reindex = "commerce.search.reindex:main"
commerce-outbox = "commerce.outbox.publisher:main"
commerce-openapi = "commerce.openapi_export:main"

[tool.uv.sources]
ai-commerce-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose services (PostgreSQL, Redis, OpenSearch)",
    "pinecone: needs a real Pinecone account (PINECONE_API_KEY)",
]
