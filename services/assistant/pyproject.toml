[project]
name = "assistant"
version = "0.1.0"
description = "Assistant API: Steph (shopping) and Xana (support), one LangGraph over narrow commerce tools"
requires-python = ">=3.12"
dependencies = [
    "ai-commerce-telemetry",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary,pool]==3.3.6",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.6.5",
    "langchain-anthropic==1.7.4",
    "langchain-openai==1.6.6",
    "python-multipart==0.0.32",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
]

[project.scripts]
assistant-migrate = "assistant.db:migrate_main"

[tool.uv.sources]
ai-commerce-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL, OpenSearch, and the commerce API test app",
]
