[project]
name = "ai-commerce-voice"
version = "0.1.0"
description = "Xana's real-time voice agent: streaming speech-to-text, a LangGraph support agent, and Cartesia speech over one WebSocket"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "websockets==16.1.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",
    "assistant",
]

[tool.uv.sources]
assistant = { workspace = true }

[project.scripts]
xana-voice = "ai_commerce_voice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_commerce_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL and the commerce API test app",
    "live: calls the real Cartesia and OpenAI APIs (costs money; opt in with VOICE_LIVE=1)",
]
