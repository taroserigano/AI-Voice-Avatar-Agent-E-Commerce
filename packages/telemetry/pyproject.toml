[project]
name = "ai-commerce-telemetry"
version = "0.1.0"
description = "Shared OpenTelemetry setup, span labels, and JSON logging for every Python service"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_commerce_telemetry"]
