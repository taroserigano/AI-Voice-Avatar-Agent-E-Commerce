[project]
name = "ai-commerce-stream"
version = "0.1.0"
description = "Assistant streaming: SSE v2 events, the PostgreSQL turn-event store, and detached turns that clients can resume"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "starlette>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_commerce_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
