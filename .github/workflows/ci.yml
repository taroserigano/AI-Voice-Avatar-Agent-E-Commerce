name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy services/commerce/src packages/telemetry/src
      - run: uv run --directory services/commerce pytest tests/unit -q

  integration:
    name: Integration tests (PostgreSQL, Redis, OpenSearch, OTel Collector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.6-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:3.8.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://commerce:commerce@localhost:5432/commerce_test
      # Real Pinecone when the repository has the secret (a "ci" namespace); otherwise
      # meaning-based search is reported as disabled and those assertions don't apply.
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || 'ai-commerce' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run --directory services/commerce pytest tests/integration -q

  web:
    name: Web lint, types, unit tests, API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - name: Generated API contract is up to date
        run: |
          pnpm contracts
          git diff --exit-code -- packages/contracts || (echo "::error::Run 'pnpm contracts' and commit the result." && exit 1)
      - run: pnpm --filter @ai-commerce/web lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @ai-commerce/web test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
