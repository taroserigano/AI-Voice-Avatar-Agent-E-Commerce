  <g transform="translate(320 318) scale(1.2) translate(-320 -295)" stroke="#0f285e" stroke-width="4" stroke-linejoin="round" stroke-opacity=".45"><circle cx="320" cy="320" r="110" fill="#e2e8f0"/><circle cx="320" cy="320" r="92" fill="#334155"/><circle cx="320" cy="320" r="80" fill="none" stroke="#2563eb" stroke-width="8" stroke-dasharray="300 200"/><text x="320" y="342" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" fill="#ffffff" stroke="none">72°</text></g>
</svg>
