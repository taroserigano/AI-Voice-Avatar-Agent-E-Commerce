<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Smart thermostat">
  <title>Smart thermostat</title>
  <defs>
    <radialGradient id="t-smart-thermostat-bg" cx="320" cy="260" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fe"/>
      <stop offset="1" stop-color="#dae4fc"/>
    </radialGradient>
    <filter id="t-smart-thermostat-blur" x="-50%" y="-50%" width="200%" height="200%">
