<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Double-Wall French Press, 34 oz">
  <defs>
    <radialGradient id="kettleworth-french-press-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6E6CF"/>
    </radialGradient>
    <filter id="kettleworth-french-press-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="kettleworth-french-press-body" x1="240" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7f8791"/>
      <stop offset=".1" stop-color="#c9cfd6"/>
      <stop offset=".22" stop-color="#f7f9fb"/>
      <stop offset=".34" stop-color="#b8bfc7"/>
      <stop offset=".52" stop-color="#dde2e7"/>
      <stop offset=".74" stop-color="#8f979f"/>
      <stop offset=".9" stop-color="#6c747d"/>
      <stop offset="1" stop-color="#8a929b"/>
    </linearGradient>
    <linearGradient id="kettleworth-french-press-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d757e"/>
      <stop offset=".25" stop-color="#d7dce2"/>
      <stop offset=".5" stop-color="#9aa2ab"/>
      <stop offset="1" stop-color="#5d656e"/>
    </linearGradient>
    <linearGradient id="kettleworth-french-press-lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c3c9d0"/>
      <stop offset="1" stop-color="#78808a"/>
    </linearGradient>
    <radialGradient id="kettleworth-french-press-knob" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c3c9d0"/>
      <stop offset="1" stop-color="#6d757e"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#kettleworth-french-press-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="318" cy="498" rx="120" ry="18" fill="#1e1b4b" fill-opacity=".16" filter="url(#kettleworth-french-press-shadow)"/>
  <g transform="translate(-20 0)">
    <!-- handle -->
    <path d="M388 230c52 0 64 14 64 54v104c0 34-12 44-62 44" fill="none" stroke="#7d858e" stroke-width="22" stroke-linecap="round"/>
    <path d="M394 222c44 0 56 12 57 46" fill="none" stroke="#f4f6f8" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
    <path d="M446 300v90" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    <rect x="380" y="218" width="20" height="26" rx="4" fill="url(#kettleworth-french-press-dark)"/>
    <rect x="380" y="418" width="20" height="26" rx="4" fill="url(#kettleworth-french-press-dark)"/>
    <!-- body -->
    <path d="M240 198v272a75 12 0 0 0 150 0V198z" fill="url(#kettleworth-french-press-body)"/>
    <path d="M238 460v12a77 13 0 0 0 154 0v-12a77 13 0 0 1-154 0z" fill="url(#kettleworth-french-press-dark)"/>
    <path d="M240 236a75 12 0 0 0 150 0M240 432a75 12 0 0 0 150 0" fill="none" stroke="#6c747d" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M240 238a75 12 0 0 0 150 0M240 434a75 12 0 0 0 150 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="304" y="318" width="22" height="7" rx="3.5" fill="#6c747d" fill-opacity=".35"/>
    <!-- spout + rim -->
    <path d="M244 190 224 186q-6 0-2 6l20 16z" fill="url(#kettleworth-french-press-lid)"/>
    <path d="M238 188v12a77 13 0 0 0 154 0v-12z" fill="url(#kettleworth-french-press-dark)"/>
    <!-- lid -->
    <path d="M236 190q79-38 158 0a79 13 0 0 1-158 0z" fill="url(#kettleworth-french-press-lid)"/>
    <path d="M258 180q40-16 90-12" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="315" cy="170" rx="18" ry="5" fill="#8a929b"/>
    <!-- plunger -->
    <rect x="311" y="104" width="8" height="66" rx="2" fill="url(#kettleworth-french-press-dark)"/>
    <ellipse cx="315" cy="98" rx="20" ry="16" fill="url(#kettleworth-french-press-knob)"/>
    <ellipse cx="308" cy="91" rx="6" ry="3.5" fill="#fff" fill-opacity=".85"/>
    <!-- highlights -->
    <path d="M270 206v258" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
