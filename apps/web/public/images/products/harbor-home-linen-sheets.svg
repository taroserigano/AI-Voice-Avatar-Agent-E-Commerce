    <use href="#harbor-home-linen-sheets-l3" fill="url(#harbor-home-linen-sheets-side)"/>
    <path d="M136 322h368" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
