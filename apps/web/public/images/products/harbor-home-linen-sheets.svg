<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Washed Linen Sheet Set">
  <defs>
    <radialGradient id="harbor-home-linen-sheets-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6E6CF"/>
    </radialGradient>
    <filter id="harbor-home-linen-sheets-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="harbor-home-linen-sheets-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4cf"/>
      <stop offset=".2" stop-color="#e2d2b6"/>
      <stop offset=".7" stop-color="#d4c09f"/>
      <stop offset="1" stop-color="#bba381"/>
    </linearGradient>
    <linearGradient id="harbor-home-linen-sheets-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d8be"/>
      <stop offset="1" stop-color="#f3e9d7"/>
    </linearGradient>
    <linearGradient id="harbor-home-linen-sheets-side" x1="110" y1="0" x2="530" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".82" stop-color="#6b5436" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b5436" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="harbor-home-linen-sheets-tie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf5ec"/>
      <stop offset=".6" stop-color="#ede3d1"/>
      <stop offset="1" stop-color="#d6c7ad"/>
    </linearGradient>
    <path id="harbor-home-linen-sheets-l1" d="M132 432h376q14 0 16 30-2 30-16 30H132q-14 0-16-30 2-30 16-30z"/>
    <path id="harbor-home-linen-sheets-l2" d="M140 374h362q14 0 16 30-2 30-16 30H140q-14 0-16-30 2-30 16-30z"/>
    <path id="harbor-home-linen-sheets-l3" d="M128 316h384q14 0 16 30-2 30-16 30H128q-14 0-16-30 2-30 16-30z"/>
    <path id="harbor-home-linen-sheets-l4" d="M146 258h348q14 0 16 30-2 30-16 30H146q-14 0-16-30 2-30 16-30z"/>
  </defs>
  <rect width="640" height="640" fill="url(#harbor-home-linen-sheets-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="320" cy="472" rx="190" ry="20" fill="#1e1b4b" fill-opacity=".16" filter="url(#harbor-home-linen-sheets-shadow)"/>
  <g transform="translate(0 -28)">
