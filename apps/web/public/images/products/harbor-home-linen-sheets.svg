    <path d="M326 284q14-12 40-2M422 284q-14-12-40-2" fill="none" stroke="#b8a584" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="362" y="272" width="24" height="22" rx="8" fill="#f8f2e8"/>
    <path d="M366 276q8-3 16 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
