    <path d="M354 194h30l6 70h-32z" fill="url(#harbor-home-linen-sheets-tie)"/>
    <path d="M358 258h32v234h-32z" fill="url(#harbor-home-linen-sheets-tie)"/>
    <path d="M358 318h32M358 376h32M358 434h32" stroke="#8a7050" stroke-opacity=".28" stroke-width="3"/>
    <path d="M361 262v228M387 262v228" stroke="#b8a584" stroke-opacity=".6" stroke-width="1.2" stroke-dasharray="4 4"/>
    <!-- bow -->
    <path d="M370 284c-26 30-12 60 2 54l6-50z" fill="#e6d9c3"/>
    <path d="M378 284c26 30 14 62-2 56l-6-52z" fill="#dccdb3"/>
    <path d="M372 280c-40-30-68-10-56 10 10 16 36 10 56-6z" fill="#f6efe3"/>
