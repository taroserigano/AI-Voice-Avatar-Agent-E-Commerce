    <path d="M140 318h360" stroke="#6b5436" stroke-opacity=".2" stroke-width="6" stroke-linecap="round"/>
    <use href="#harbor-home-linen-sheets-l4" fill="url(#harbor-home-linen-sheets-front)"/>
    <use href="#harbor-home-linen-sheets-l4" fill="url(#harbor-home-linen-sheets-side)"/>
    <path d="M154 264h332" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M170 290q30 10 60 4M410 300q40 8 70-2" fill="none" stroke="#9c8260" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
