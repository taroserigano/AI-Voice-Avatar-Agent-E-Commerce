    <linearGradient id="sonora-studio-wired-headphones-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55585f"/>
      <stop offset=".45" stop-color="#26282d"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
    <linearGradient id="sonora-studio-wired-headphones-pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4c53"/>
