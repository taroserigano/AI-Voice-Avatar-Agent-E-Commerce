<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Charge 20K Power Bank">
  <defs>
    <radialGradient id="lumen-power-bank-20k-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1F3FF"/>
      <stop offset="1" stop-color="#DCE1FB"/>
    </radialGradient>
    <filter id="lumen-power-bank-20k-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="lumen-power-bank-20k-top" x1="130" y1="210" x2="510" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d6a88"/>
      <stop offset=".5" stop-color="#3d4762"/>
      <stop offset="1" stop-color="#2a3148"/>
    </linearGradient>
    <linearGradient id="lumen-power-bank-20k-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5b78"/>
      <stop offset="1" stop-color="#323a53"/>
    </linearGradient>
    <linearGradient id="lumen-power-bank-20k-side" x1="130" y1="0" x2="510" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c3349"/>
      <stop offset=".6" stop-color="#20263a"/>
      <stop offset="1" stop-color="#141827"/>
    </linearGradient>
    <linearGradient id="lumen-power-bank-20k-sideShade" x1="0" y1="350" x2="0" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="lumen-power-bank-20k-led" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#lumen-power-bank-20k-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="324" cy="410" rx="176" ry="18" fill="#1e1b4b" opacity=".16" filter="url(#lumen-power-bank-20k-blur)"/>

  <!-- body thickness -->
  <rect x="130" y="264" width="380" height="140" rx="46" ry="32" fill="url(#lumen-power-bank-20k-side)"/>
  <rect x="130" y="264" width="380" height="140" rx="46" ry="32" fill="url(#lumen-power-bank-20k-sideShade)"/>
  <!-- ports -->
  <rect x="222" y="372" width="28" height="10" rx="5" fill="#07080d"/>
  <rect x="228" y="376" width="16" height="2.4" rx="1.2" fill="#3b4256"/>
  <rect x="266" y="368" width="42" height="16" rx="2.5" fill="#07080d"/>
  <rect x="270" y="371" width="34" height="5" rx="1" fill="#e7ecf5"/>
  <rect x="324" y="372" width="28" height="10" rx="5" fill="#07080d"/>
  <rect x="330" y="376" width="16" height="2.4" rx="1.2" fill="#3b4256"/>
  <rect x="432" y="374" width="22" height="6" rx="3" fill="#4a5470"/>
  <path d="M150 388C162 398 176 402 196 402" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>

  <!-- usb-c cable -->
  <path d="M236 392C238 438 300 452 372 450C420 448 462 442 500 452" fill="none" stroke="#e8ebf3" stroke-width="7" stroke-linecap="round"/>
  <path d="M234 394C236 434 296 446 372 444" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
  <path d="M238 398C242 440 300 454 372 452C420 450 462 444 500 454" fill="none" stroke="#9aa2b5" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <rect x="226" y="376" width="20" height="24" rx="6" fill="#f3f5fa"/>
  <rect x="240" y="378" width="5" height="20" rx="2.5" fill="#b8bfcd"/>
  <!-- top face -->
  <rect x="130" y="210" width="380" height="140" rx="46" ry="32" fill="url(#lumen-power-bank-20k-top)"/>
  <rect x="152" y="226" width="336" height="108" rx="32" ry="22" fill="url(#lumen-power-bank-20k-panel)"/>
  <path d="M176 212C156 214 136 226 132 248" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <path d="M190 212H380" stroke="#fff" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 236C162 244 160 252 160 262" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  <!-- abstract mark -->
  <circle cx="208" cy="278" r="9" fill="none" stroke="#8d9bc0" stroke-opacity=".55" stroke-width="2.5"/>
  <circle cx="208" cy="278" r="3" fill="#8d9bc0" fill-opacity=".55"/>
  <!-- charge LEDs -->
  <circle cx="400" cy="312" r="11" fill="url(#lumen-power-bank-20k-led)"/>
  <circle cx="420" cy="312" r="11" fill="url(#lumen-power-bank-20k-led)"/>
  <circle cx="440" cy="312" r="11" fill="url(#lumen-power-bank-20k-led)"/>
  <circle cx="400" cy="312" r="3.8" fill="#e0f6ff"/>
  <circle cx="420" cy="312" r="3.8" fill="#e0f6ff"/>
  <circle cx="440" cy="312" r="3.8" fill="#e0f6ff"/>
  <circle cx="460" cy="312" r="3.8" fill="#222839"/>
  <circle cx="460" cy="312" r="3.8" fill="none" stroke="#6b7898" stroke-opacity=".5" stroke-width="1"/>
</svg>
