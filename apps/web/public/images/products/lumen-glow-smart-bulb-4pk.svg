<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Glow Smart LED Bulbs, 4-Pack">
  <defs>
    <radialGradient id="lumen-glow-smart-bulb-4pk-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1F3FF"/>
      <stop offset="1" stop-color="#DCE1FB"/>
    </radialGradient>
    <filter id="lumen-glow-smart-bulb-4pk-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="lumen-glow-smart-bulb-4pk-halo" cx="320" cy="276" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd67a" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffd67a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd67a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lumen-glow-smart-bulb-4pk-glass" cx=".36" cy=".28" r=".85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#eef0f7"/>
      <stop offset="1" stop-color="#c3c9dc"/>
    </radialGradient>
    <radialGradient id="lumen-glow-smart-bulb-4pk-lit" cx=".45" cy=".38" r=".75">
      <stop offset="0" stop-color="#fffef6"/>
      <stop offset=".45" stop-color="#ffeeb8"/>
      <stop offset="1" stop-color="#f6c15e"/>
    </radialGradient>
    <linearGradient id="lumen-glow-smart-bulb-4pk-collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e3e6ee"/>
      <stop offset="1" stop-color="#b9bfcf"/>
    </linearGradient>
    <linearGradient id="lumen-glow-smart-bulb-4pk-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f3f8"/>
      <stop offset=".4" stop-color="#bcc3d0"/>
      <stop offset="1" stop-color="#737b8c"/>
    </linearGradient>
    <linearGradient id="lumen-glow-smart-bulb-4pk-warmside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity=".35"/>
    </linearGradient>
    <g id="lumen-glow-smart-bulb-4pk-base">
      <rect x="-30" y="134" width="60" height="20" rx="6" fill="url(#lumen-glow-smart-bulb-4pk-collar)"/>
      <rect x="-25" y="152" width="50" height="40" rx="4" fill="url(#lumen-glow-smart-bulb-4pk-steel)"/>
      <path d="M-25 160Q0 166 25 157M-25 171Q0 177 25 168M-25 182Q0 188 25 179" fill="none" stroke="#6b7384" stroke-width="2"/>
      <path d="M-25 163Q0 169 25 160M-25 174Q0 180 25 171M-25 185Q0 191 25 182" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>
      <path d="M-15 192H15L8 204H-8Z" fill="#2f323a"/>
      <circle cx="0" cy="205" r="4" fill="#a7afbf"/>
    </g>
    <path id="lumen-glow-smart-bulb-4pk-globe" d="M-28 140C-34 122 -62 104 -62 62A62 62 0 1 1 62 62C62 104 34 122 28 140Z"/>
  </defs>
  <rect width="640" height="640" fill="url(#lumen-glow-smart-bulb-4pk-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <circle cx="320" cy="276" r="190" fill="url(#lumen-glow-smart-bulb-4pk-halo)"/>
  <ellipse cx="320" cy="490" rx="180" ry="18" fill="#1e1b4b" opacity=".16" filter="url(#lumen-glow-smart-bulb-4pk-blur)"/>

  <!-- left bulb -->
  <g transform="translate(192 204) scale(1.26)">
    <use xlink:href="#lumen-glow-smart-bulb-4pk-base" href="#lumen-glow-smart-bulb-4pk-base"/>
    <use xlink:href="#lumen-glow-smart-bulb-4pk-globe" href="#lumen-glow-smart-bulb-4pk-globe" fill="url(#lumen-glow-smart-bulb-4pk-glass)"/>
    <use xlink:href="#lumen-glow-smart-bulb-4pk-globe" href="#lumen-glow-smart-bulb-4pk-globe" fill="url(#lumen-glow-smart-bulb-4pk-warmside)"/>
    <ellipse cx="-26" cy="34" rx="14" ry="22" transform="rotate(30 -26 34)" fill="#fff" fill-opacity=".85"/>
  </g>
  <!-- right bulb -->
  <g transform="translate(448 204) scale(1.26)">
    <use xlink:href="#lumen-glow-smart-bulb-4pk-base" href="#lumen-glow-smart-bulb-4pk-base"/>
    <use xlink:href="#lumen-glow-smart-bulb-4pk-globe" href="#lumen-glow-smart-bulb-4pk-globe" fill="url(#lumen-glow-smart-bulb-4pk-glass)"/>
    <use xlink:href="#lumen-glow-smart-bulb-4pk-globe" href="#lumen-glow-smart-bulb-4pk-globe" fill="url(#lumen-glow-smart-bulb-4pk-warmside)" transform="scale(-1 1)"/>
    <ellipse cx="-26" cy="34" rx="14" ry="22" transform="rotate(30 -26 34)" fill="#fff" fill-opacity=".85"/>
  </g>
  <!-- center glowing bulb -->
  <g transform="translate(320 178) scale(1.5)">
    <use xlink:href="#lumen-glow-smart-bulb-4pk-base" href="#lumen-glow-smart-bulb-4pk-base"/>
    <use xlink:href="#lumen-glow-smart-bulb-4pk-globe" href="#lumen-glow-smart-bulb-4pk-globe" fill="url(#lumen-glow-smart-bulb-4pk-lit)"/>
    <ellipse cx="0" cy="66" rx="34" ry="36" fill="#fff" fill-opacity=".55" filter="url(#lumen-glow-smart-bulb-4pk-blur)"/>
    <ellipse cx="-26" cy="34" rx="12" ry="20" transform="rotate(30 -26 34)" fill="#fff" fill-opacity=".9"/>
  </g>
</svg>
