<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Gooseneck Electric Kettle">
  <defs>
    <radialGradient id="kettleworth-gooseneck-kettle-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6E6CF"/>
    </radialGradient>
    <filter id="kettleworth-gooseneck-kettle-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="kettleworth-gooseneck-kettle-body" x1="198" y1="0" x2="422" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a5b62"/>
      <stop offset=".28" stop-color="#37383e"/>
      <stop offset=".66" stop-color="#232428"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="kettleworth-gooseneck-kettle-lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d5e65"/>
      <stop offset=".5" stop-color="#3a3b41"/>
      <stop offset="1" stop-color="#202125"/>
    </linearGradient>
    <linearGradient id="kettleworth-gooseneck-kettle-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1aa"/>
      <stop offset=".22" stop-color="#f4f6f8"/>
      <stop offset=".45" stop-color="#b9c0c8"/>
      <stop offset=".7" stop-color="#e3e7eb"/>
      <stop offset="1" stop-color="#7c848d"/>
    </linearGradient>
    <linearGradient id="kettleworth-gooseneck-kettle-base" x1="170" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4b51"/>
      <stop offset=".4" stop-color="#2c2d32"/>
      <stop offset="1" stop-color="#121315"/>
    </linearGradient>
    <radialGradient id="kettleworth-gooseneck-kettle-led" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd48a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#kettleworth-gooseneck-kettle-bg)"/>
  <circle cx="320" cy="310" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="342" cy="524" rx="165" ry="18" fill="#1e1b4b" fill-opacity=".16" filter="url(#kettleworth-gooseneck-kettle-shadow)"/>
  <g transform="translate(39 0)">
    <!-- base -->
    <path d="M170 478v16a140 22 0 0 0 280 0v-16z" fill="url(#kettleworth-gooseneck-kettle-base)"/>
    <ellipse cx="310" cy="478" rx="140" ry="22" fill="#3a3b41"/>
    <ellipse cx="310" cy="478" rx="124" ry="17" fill="#2a2b30"/>
    <path d="M176 486a140 22 0 0 0 268 0" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
    <circle cx="310" cy="506" r="9" fill="url(#kettleworth-gooseneck-kettle-led)"/>
    <circle cx="310" cy="506" r="3" fill="#ffe2ad"/>
    <!-- handle -->
    <path d="M404 292c62-4 82 8 82 46l-2 58c-2 30-22 40-64 40" fill="none" stroke="#26272b" stroke-width="24" stroke-linecap="round"/>
    <path d="M410 284c52-2 70 8 72 38" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
    <!-- spout -->
    <path d="M206 430c-56-6-82-58-88-124-4-44-18-60-46-50" fill="none" stroke="#2b2c31" stroke-width="13" stroke-linecap="round"/>
    <path d="M198 421c-46-7-66-52-72-114-3-34-12-48-32-48" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="206" cy="428" rx="11" ry="16" fill="#1d1e22"/>
    <!-- body -->
    <path d="M214 268 198 466a112 20 0 0 0 224 0L406 268z" fill="url(#kettleworth-gooseneck-kettle-body)"/>
    <path d="M230 286 218 448l20 3 11-165z" fill="#fff" fill-opacity=".12"/>
    <path d="M256 286 248 452l7 1 7-167z" fill="#fff" fill-opacity=".08"/>
    <path d="M390 286 402 452" stroke="#000" stroke-opacity=".18" stroke-width="10"/>
    <!-- steel foot ring -->
    <path d="M199 452 198 466a112 20 0 0 0 224 0l-1-14a111 20 0 0 1-222 0z" fill="url(#kettleworth-gooseneck-kettle-steel)"/>
    <!-- lid -->
    <path d="M214 268a96 18 0 0 0 192 0" fill="none" stroke="#5c5d64" stroke-width="2"/>
    <path d="M216 266q94-38 188 0a94 16 0 0 1-188 0z" fill="url(#kettleworth-gooseneck-kettle-lid)"/>
    <path d="M238 258q60-22 120-14" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    <rect x="295" y="226" width="30" height="20" rx="4" fill="url(#kettleworth-gooseneck-kettle-steel)"/>
    <ellipse cx="310" cy="226" rx="15" ry="5" fill="#f1f3f6"/>
    <!-- tiny mark -->
    <rect x="300" y="330" width="20" height="6" rx="3" fill="#fff" fill-opacity=".16"/>
  </g>
</svg>
