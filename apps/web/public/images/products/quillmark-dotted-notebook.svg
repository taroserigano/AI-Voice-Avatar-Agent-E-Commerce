<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Dotted Hardcover Notebook, A5">
  <defs>
    <radialGradient id="quillmark-dotted-notebook-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset="1" stop-color="#DEE4EC"/>
    </radialGradient>
    <filter id="quillmark-dotted-notebook-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="quillmark-dotted-notebook-dots" x="4" y="4" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.4" fill="#b4ada0"/>
    </pattern>
    <linearGradient id="quillmark-dotted-notebook-page" x1="90" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset=".44" stop-color="#f3eee3"/>
      <stop offset=".5" stop-color="#d9d2c3"/>
      <stop offset=".56" stop-color="#f3eee3"/>
      <stop offset="1" stop-color="#fdfaf4"/>
    </linearGradient>
    <linearGradient id="quillmark-dotted-notebook-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#447c5f"/>
      <stop offset=".45" stop-color="#2f5d46"/>
      <stop offset="1" stop-color="#1f4332"/>
    </linearGradient>
    <linearGradient id="quillmark-dotted-notebook-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3a31"/>
      <stop offset=".4" stop-color="#16201a"/>
      <stop offset="1" stop-color="#0e1511"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#quillmark-dotted-notebook-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="330" cy="512" rx="190" ry="20" fill="#1e1b4b" fill-opacity=".16" filter="url(#quillmark-dotted-notebook-shadow)"/>
  <g transform="translate(6 -18)">
    <!-- open notebook behind -->
    <g transform="rotate(-8 250 280)">
      <rect x="80" y="156" width="340" height="250" rx="9" fill="#234836"/>
      <path d="M88 166h324v232H88z" fill="#e6dfd0"/>
      <rect x="90" y="162" width="320" height="232" rx="3" fill="url(#quillmark-dotted-notebook-page)"/>
      <rect x="102" y="174" width="136" height="208" fill="url(#quillmark-dotted-notebook-dots)"/>
      <rect x="262" y="174" width="136" height="208" fill="url(#quillmark-dotted-notebook-dots)"/>
      <path d="M160 214q30-18 60-4M130 250q40 6 70-10" fill="none" stroke="#2f5d46" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M250 162v232" stroke="#b8ae9c" stroke-width="1.5"/>
    </g>
    <!-- closed notebook -->
    <g transform="rotate(6 410 345)">
      <rect x="308" y="198" width="220" height="310" rx="10" fill="#1c3d2d"/>
      <rect x="304" y="194" width="218" height="306" rx="6" fill="#f3eee2"/>
      <path d="M520 204v288M514 498H316" stroke="#d6cdbb" stroke-width="1.5" stroke-dasharray="1 3"/>
      <!-- ribbon -->
      <path d="M394 490h16v64l-8-9-8 9z" fill="#c8674a"/>
      <path d="M394 490h5v62l-5 2z" fill="#fff" fill-opacity=".2"/>
      <rect x="300" y="190" width="214" height="304" rx="10" fill="url(#quillmark-dotted-notebook-cover)"/>
      <path d="M326 194v296" stroke="#173426" stroke-width="3"/>
      <path d="M330 194v296" stroke="#5a9477" stroke-opacity=".5" stroke-width="1.5"/>
      <path d="M306 200q4-6 12-6h180" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2.5" stroke-linecap="round"/>
      <!-- debossed mark -->
      <rect x="400" y="430" width="30" height="30" rx="8" fill="#1f4332" fill-opacity=".7"/>
      <rect x="400" y="431" width="30" height="30" rx="8" fill="none" stroke="#5a9477" stroke-opacity=".45" stroke-width="1.5"/>
      <!-- elastic band -->
      <rect x="474" y="186" width="13" height="316" rx="3" fill="url(#quillmark-dotted-notebook-band)"/>
      <path d="M477 190v308" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
    </g>
  </g>
</svg>
