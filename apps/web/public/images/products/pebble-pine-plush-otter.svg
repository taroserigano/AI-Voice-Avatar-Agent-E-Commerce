    <circle cx="218" cy="186" r="16" fill="#8a5c3a"/>
    <circle cx="220" cy="188" r="8" fill="#5e3d23"/>
    <circle cx="422" cy="186" r="16" fill="#7a5034"/>
    <circle cx="420" cy="188" r="8" fill="#5e3d23"/>

