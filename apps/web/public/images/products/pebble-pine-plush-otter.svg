    <ellipse cx="320" cy="210" rx="114" ry="88" fill="url(#pebble-pine-plush-otter-head)"/>
    <path d="M248 148C268 130 296 122 322 122" fill="none" stroke="#e0b88c" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/>
    <path d="M300 128C304 124 310 122 316 122M330 124C334 126 336 130 336 134" fill="none" stroke="#6b4529" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
