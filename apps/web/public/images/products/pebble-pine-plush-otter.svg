    <path d="M320 240V250M306 252C312 258 318 256 320 250C322 256 328 258 334 252" fill="none" stroke="#3a2418" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#6b4529" fill-opacity=".55">
      <circle cx="286" cy="240" r="2"/><circle cx="280" cy="250" r="2"/><circle cx="292" cy="252" r="2"/>
      <circle cx="354" cy="240" r="2"/><circle cx="360" cy="250" r="2"/><circle cx="348" cy="252" r="2"/>
