    <ellipse cx="266" cy="474" rx="24" ry="16" transform="rotate(-12 266 474)" fill="url(#pebble-pine-plush-otter-cream)"/>
    <ellipse cx="266" cy="478" rx="9" ry="6" fill="#7a5034"/>
    <circle cx="252" cy="466" r="3.6" fill="#7a5034"/><circle cx="264" cy="462" r="3.6" fill="#7a5034"/><circle cx="276" cy="464" r="3.6" fill="#7a5034"/>
    <ellipse cx="372" cy="472" rx="34" ry="24" transform="rotate(12 372 472)" fill="#7e5333"/>
