    <linearGradient id="pebble-pine-plush-otter-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6d0"/>
      <stop offset="1" stop-color="#f19b95"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#pebble-pine-plush-otter-bg)"/>
  <circle cx="320" cy="300" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="330" cy="494" rx="170" ry="18" fill="#1e1b4b" opacity=".16" filter="url(#pebble-pine-plush-otter-blur)"/>

