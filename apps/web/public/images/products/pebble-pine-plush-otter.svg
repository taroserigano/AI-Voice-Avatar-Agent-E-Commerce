<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Plush Otter Stuffed Animal">
  <defs>
    <radialGradient id="pebble-pine-plush-otter-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F4FF"/>
      <stop offset="1" stop-color="#E4DDFB"/>
    </radialGradient>
    <filter id="pebble-pine-plush-otter-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="pebble-pine-plush-otter-fur" cx=".35" cy=".25" r=".85">
      <stop offset="0" stop-color="#c4966a"/>
      <stop offset=".55" stop-color="#9a6b45"/>
      <stop offset="1" stop-color="#6b4529"/>
    </radialGradient>
    <radialGradient id="pebble-pine-plush-otter-head" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#c99d71"/>
      <stop offset=".6" stop-color="#9f704a"/>
      <stop offset="1" stop-color="#76502f"/>
    </radialGradient>
    <linearGradient id="pebble-pine-plush-otter-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6240"/>
      <stop offset="1" stop-color="#5e3d23"/>
    </linearGradient>
    <radialGradient id="pebble-pine-plush-otter-cream" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#fbf0dc"/>
      <stop offset="1" stop-color="#e3c8a0"/>
