      <use xlink:href="#pebble-pine-puzzle-1000-piece" href="#pebble-pine-puzzle-1000-piece" transform="scale(.86 .5) rotate(18)" fill="#ef8a8f"/>
    </g>
    <g transform="translate(262 474)">
      <use xlink:href="#pebble-pine-puzzle-1000-piece" href="#pebble-pine-puzzle-1000-piece" transform="translate(0 5) scale(.86 .5) rotate(-24)" fill="#12163d"/>
      <use xlink:href="#pebble-pine-puzzle-1000-piece" href="#pebble-pine-puzzle-1000-piece" transform="scale(.86 .5) rotate(-24)" fill="#34357f"/>
      <path d="M-10 -2H10M-6 4H6" stroke="#ffd79a" stroke-width="2" stroke-linecap="round"/>
