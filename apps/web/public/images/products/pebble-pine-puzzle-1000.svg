    <rect x="288" y="386" width="48" height="14" rx="7" fill="#fff" fill-opacity=".3"/>
    <use xlink:href="#pebble-pine-puzzle-1000-piece" href="#pebble-pine-puzzle-1000-piece" transform="translate(420 394) scale(.2)" fill="#f5f2ff"/>
    <path d="M186 176L140 420H150L200 176Z" fill="url(#pebble-pine-puzzle-1000-gloss)"/>

