<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Harbor Lights 1000-Piece Puzzle">
  <defs>
    <radialGradient id="pebble-pine-puzzle-1000-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F4FF"/>
      <stop offset="1" stop-color="#E4DDFB"/>
    </radialGradient>
    <filter id="pebble-pine-puzzle-1000-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="pebble-pine-puzzle-1000-sky" x1="0" y1="188" x2="0" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2874"/>
      <stop offset=".45" stop-color="#6d3a9a"/>
      <stop offset=".78" stop-color="#df6f96"/>
      <stop offset="1" stop-color="#f9ad6c"/>
    </linearGradient>
    <linearGradient id="pebble-pine-puzzle-1000-sea" x1="0" y1="310" x2="0" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a4a9e"/>
      <stop offset=".3" stop-color="#34357f"/>
      <stop offset="1" stop-color="#1b1f55"/>
    </linearGradient>
    <radialGradient id="pebble-pine-puzzle-1000-sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".5" stop-color="#ffc47a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffc47a" stop-opacity="0"/>
