      <circle cx="300" cy="310" r="44" fill="url(#pebble-pine-puzzle-1000-sun)"/>
      <circle cx="300" cy="312" r="16" fill="#ffe3a3"/>
      <rect x="142" y="310" width="296" height="62" fill="url(#pebble-pine-puzzle-1000-sea)"/>
      <path d="M282 318H318M288 326H312M292 334H308M294 342H306" stroke="#ffd79a" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
      <!-- town -->
      <path d="M142 312V270H156V258L166 250L176 258V280H188V262H204V252L214 244L224 252V284H236V274H248V312Z" fill="#2a2360"/>
      <g fill="#ffd166">
        <rect x="146" y="278" width="4" height="5"/><rect x="161" y="264" width="4" height="5"/><rect x="168" y="276" width="4" height="5"/><rect x="192" y="270" width="4" height="5"/><rect x="198" y="290" width="4" height="5"/><rect x="210" y="258" width="4" height="5"/><rect x="216" y="276" width="4" height="5"/><rect x="240" y="286" width="4" height="5"/><rect x="152" y="296" width="4" height="5"/>
      </g>
      <path d="M150 318V330M168 318V334M196 318V330M214 318V336M242 318V328" stroke="#ffd166" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
      <path d="M246 312H292" stroke="#2a2360" stroke-width="3"/>
      <path d="M254 312V318M270 312V318M286 312V318" stroke="#2a2360" stroke-width="2"/>
      <!-- sailboat -->
      <path d="M330 338H362L356 346H336Z" fill="#221d4f"/>
      <path d="M346 336V300L364 334Z" fill="#fde7c4"/>
      <path d="M344 336V308L332 334Z" fill="#f4b99a"/>
      <!-- lighthouse -->
      <path d="M160 264L398 236L398 250Z" fill="url(#pebble-pine-puzzle-1000-beam)"/>
      <path d="M370 318C376 300 390 294 404 296C420 292 434 300 438 312V318Z" fill="#1d1a45"/>
      <path d="M392 298L396 246H408L412 298Z" fill="#f5f2ff"/>
      <path d="M393.4 282L394.5 268H409.5L410.6 282Z" fill="#e0525f"/>
      <path d="M395.3 258L395.8 250H408.2L408.7 258Z" fill="#e0525f"/>
      <rect x="394" y="236" width="16" height="10" rx="2" fill="#ffe29a"/>
      <circle cx="402" cy="241" r="12" fill="#fff3c4" fill-opacity=".35"/>
      <path d="M392 236L402 228L412 236Z" fill="#2a2360"/>
      <rect x="142" y="188" width="296" height="184" fill="url(#pebble-pine-puzzle-1000-grid)"/>
