      <use xlink:href="#pebble-pine-puzzle-1000-piece" href="#pebble-pine-puzzle-1000-piece" transform="scale(.86 .5) rotate(52)" fill="#7b4aa8"/>
      <circle cx="-4" cy="-3" r="1.4" fill="#fff"/><circle cx="8" cy="2" r="1" fill="#fff"/>
