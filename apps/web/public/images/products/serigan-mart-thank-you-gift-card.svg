<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Serigan Mart Thank You Gift Card">
  <defs>
    <radialGradient id="serigan-mart-thank-you-gift-card-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3FBF6"/>
      <stop offset="1" stop-color="#DDF1E6"/>
    </radialGradient>
    <filter id="serigan-mart-thank-you-gift-card-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="serigan-mart-thank-you-gift-card-face" x1="-200" y1="-126" x2="200" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ee0c3"/>
      <stop offset=".4" stop-color="#23b58f"/>
      <stop offset=".75" stop-color="#0f8a72"/>
      <stop offset="1" stop-color="#0b5a4c"/>
    </linearGradient>
    <linearGradient id="serigan-mart-thank-you-gift-card-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#86e3c3"/>
    </linearGradient>
    <linearGradient id="serigan-mart-thank-you-gift-card-gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="serigan-mart-thank-you-gift-card-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b07a22"/>
      <stop offset=".3" stop-color="#f7dc92"/>
      <stop offset=".6" stop-color="#dcaa45"/>
      <stop offset="1" stop-color="#a06d1c"/>
    </linearGradient>
    <linearGradient id="serigan-mart-thank-you-gift-card-bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe6a8"/>
      <stop offset=".5" stop-color="#dcaa45"/>
      <stop offset="1" stop-color="#9c6a1a"/>
    </linearGradient>
    <clipPath id="serigan-mart-thank-you-gift-card-clip">
      <rect x="-200" y="-126" width="400" height="252" rx="22"/>
    </clipPath>
    <g id="serigan-mart-thank-you-gift-card-floret">
      <ellipse cx="0" cy="-10" rx="7.5" ry="11" fill="#f0fdf7"/>
      <ellipse cx="0" cy="-10" rx="7.5" ry="11" fill="#ccf5e4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="7.5" ry="11" fill="#b4eed7" transform="rotate(144)"/>
      <ellipse cx="0" cy="-10" rx="7.5" ry="11" fill="#ccf5e4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-10" rx="7.5" ry="11" fill="#ffffff" transform="rotate(288)"/>
      <circle r="3.6" fill="#fcd77a"/>
    </g>
  </defs>
  <rect width="640" height="640" fill="url(#serigan-mart-thank-you-gift-card-bg)"/>
  <circle cx="320" cy="296" r="210" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="324" cy="456" rx="184" ry="18" fill="#053b2d" opacity=".16" filter="url(#serigan-mart-thank-you-gift-card-blur)"/>

  <!-- second card behind -->
  <g transform="translate(342 276) rotate(5)">
    <rect x="-200" y="-126" width="400" height="252" rx="22" fill="url(#serigan-mart-thank-you-gift-card-back)"/>
    <circle cx="120" cy="-40" r="90" fill="#fff" fill-opacity=".14"/>
  </g>

  <!-- main card -->
  <g transform="translate(314 302) rotate(-8)">
    <rect x="-200" y="-122" width="400" height="252" rx="22" fill="#064e3b" fill-opacity=".35"/>
    <rect x="-200" y="-126" width="400" height="252" rx="22" fill="url(#serigan-mart-thank-you-gift-card-face)"/>
    <g clip-path="url(#serigan-mart-thank-you-gift-card-clip)">
      <circle cx="150" cy="100" r="150" fill="#fff" fill-opacity=".06"/>
      <circle cx="170" cy="120" r="96" fill="#fff" fill-opacity=".06"/>
      <path d="M-200 60C-120 20 -40 90 60 50C120 26 170 40 200 20" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
      <path d="M-200 84C-120 44 -40 114 60 74C120 50 170 64 200 44" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
      <path d="M-60 -126H40L-60 126H-160Z" fill="url(#serigan-mart-thank-you-gift-card-gloss)"/>
      <!-- ribbon -->
      <rect x="104" y="-130" width="34" height="260" fill="url(#serigan-mart-thank-you-gift-card-ribbon)"/>
      <path d="M112 -130V130" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    </g>
    <rect x="-194" y="-120" width="388" height="240" rx="17" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>

    <!-- larkspur flower spike -->
    <path d="M-122 106C-118 50 -110 -10 -104 -100" fill="none" stroke="#d7f7ea" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-121 96C-140 80 -150 60 -152 40M-120 90C-100 76 -94 58 -92 40M-122 104C-146 96 -160 84 -168 66" fill="none" stroke="#a7ecd2" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-132 64) scale(1.3)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-102 48) scale(1.25)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-128 28) scale(1.15)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-100 12) scale(1.1)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-122 -8) scale(1)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-98 -24) scale(.9)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-116 -42) scale(.8)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-98 -58) scale(.65)"/>
    <use xlink:href="#serigan-mart-thank-you-gift-card-floret" href="#serigan-mart-thank-you-gift-card-floret" transform="translate(-110 -73) scale(.52)"/>
    <ellipse cx="-102" cy="-88" rx="4" ry="6" fill="#e6fbf2"/>
    <ellipse cx="-106" cy="-100" rx="3" ry="4.5" fill="#c2f2df"/>
    <!-- small abstract mark -->
    <circle cx="-160" cy="-88" r="9" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5"/>
    <circle cx="-160" cy="-88" r="3" fill="#fff" fill-opacity=".6"/>


    <!-- heart -->
    <path d="M10 10C10 -12 -22 -16 -22 8C-22 26 10 42 10 42C10 42 42 26 42 8C42 -16 10 -12 10 10Z"
          fill="#fff" fill-opacity=".85"/>

    <!-- bow -->
    <path d="M114 -118L92 -60L106 -66L112 -52L126 -114Z" fill="url(#serigan-mart-thank-you-gift-card-bow)"/>
    <path d="M128 -118L154 -62L140 -66L136 -52L118 -114Z" fill="url(#serigan-mart-thank-you-gift-card-bow)"/>
    <path d="M121 -122C92 -168 52 -156 64 -124C72 -102 102 -108 121 -122Z" fill="url(#serigan-mart-thank-you-gift-card-bow)"/>
    <path d="M121 -122C150 -168 190 -156 178 -124C170 -102 140 -108 121 -122Z" fill="url(#serigan-mart-thank-you-gift-card-bow)"/>
    <path d="M112 -128C96 -150 76 -148 74 -134" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
    <path d="M130 -128C146 -150 166 -148 168 -134" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
    <rect x="110" y="-134" width="22" height="24" rx="8" fill="#c8912f"/>
    <rect x="113" y="-131" width="10" height="16" rx="5" fill="#fbe6a8" fill-opacity=".7"/>
  </g>
</svg>
