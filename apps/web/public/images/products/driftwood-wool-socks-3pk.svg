    <linearGradient id="driftwood-wool-socks-3pk-char" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a7f89"/>
      <stop offset="1" stop-color="#43474f"/>
    </linearGradient>
    <linearGradient id="driftwood-wool-socks-3pk-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76a084"/>
