      <rect x="0" y="0" width="92.5" height="44" fill="url(#driftwood-wool-socks-3pk-rib)"/>
      <path d="M0 44H92.5" stroke="#000" stroke-opacity=".18" stroke-width="2"/>
      <path d="M0 1.5H92" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <use href="#driftwood-wool-socks-3pk-sock" fill="url(#driftwood-wool-socks-3pk-shade)"/>
      <path d="M100 206C120 226 150 232 180 236" stroke="#000" stroke-opacity=".12" stroke-width="3" fill="none"/>
      <path d="M78 226C60 250 62 282 76 302M172 304C162 282 162 252 182 234" stroke="#000" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="3 2" fill="none"/>
      <path d="M12 56C10 110 10 170 12 214" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
