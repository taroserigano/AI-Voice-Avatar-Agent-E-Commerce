<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Hiking Wool Socks, 3-Pair">
  <defs>
    <radialGradient id="driftwood-wool-socks-3pk-bg" cx="320" cy="240" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4F8"/>
      <stop offset="1" stop-color="#F6DCE7"/>
    </radialGradient>
    <filter id="driftwood-wool-socks-3pk-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="driftwood-wool-socks-3pk-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
